<!DOCTYPE html><html><head><meta charset="utf-8"><title>Laser Dodge</title><style>body{margin:0;background:#050510;color:#0ff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;}#game{border:2px solid #0ff;box-shadow:0 0 20px #0ff;background:#000;}#hud{margin-bottom:10px;font-size:18px;text-transform:uppercase;letter-spacing:2px;}</style></head><body><div id="hud">Score: <span id="s">0</span> | Lives: <span id="l">3</span></div><canvas id="game" width="400" height="500"></canvas><p>Move: Left / Right Arrows or Mouse</p><script>const c=document.getElementById("game"),x=c.getContext("2d"),sEl=document.getElementById("s"),lEl=document.getElementById("l");let p={x:180,y:450,w:30,h:16,speed:6},lasers=[],score=0,lives=3,gameOver=false,keys={};window.onkeydown=e=>keys[e.key]=true;window.onkeyup=e=>keys[e.key]=false;c.onmousemove=e=>{const r=c.getBoundingClientRect();p.x=e.clientX-r.left-p.w/2;};function spawn(){if(!gameOver&&Math.random()<0.08){lasers.push({x:Math.random()*(c.width-12),y:-20,w:8,h:24,vy:3+Math.random()*4,col:"#f05"});}}function loop(){if(gameOver){x.fillStyle="rgba(0,0,0,0.7)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#f05";x.font="bold 28px sans-serif";x.fillText("GAME OVER",110,240);x.fillStyle="#0ff";x.font="16px sans-serif";x.fillText("Click canvas to restart",115,280);return;}if(keys["ArrowLeft"])p.x-=p.speed;if(keys["ArrowRight"])p.x+=p.speed;p.x=Math.max(0,Math.min(c.width-p.w,p.x));spawn();x.fillStyle="#050510";x.fillRect(0,0,c.width,c.height);x.fillStyle="#0ff";x.shadowBlur=12;x.shadowColor="#0ff";x.fillRect(p.x,p.y,p.w,p.h);lasers.forEach((l,i)=>{l.y+=l.vy;x.fillStyle=l.col;x.shadowColor=l.col;x.fillRect(l.x,l.y,l.w,l.h);if(l.x<p.x+p.w&&l.x+l.w>p.x&&l.y<p.y+p.h&&l.y+l.h>p.y){lasers.splice(i,1);lives--;lEl.textContent=lives;if(lives<=0)gameOver=true;}else if(l.y>c.height){lasers.splice(i,1);score+=10;sEl.textContent=score;}});requestAnimationFrame(loop);}c.onclick=()=>{if(gameOver){lives=3;score=0;lasers=[];gameOver=false;sEl.textContent=0;lEl.textContent=3;loop();}};loop();</script></body></html>
